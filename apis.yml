name: Finni Health
description: >-
  Finni Health is a telehealth company that connects families of children on the
  autism spectrum with Applied Behavior Analysis (ABA) therapists and mental
  health providers. Operating across more than 30 states, Finni offers both
  in-home and in-clinic ABA therapy with flexible scheduling, handles insurance
  coordination and billing for its provider network, and gives parents a portal
  for progress tracking and family-led goal setting. The company positions itself
  as an operating platform for ABA practices as well as a care provider for
  families, but publishes no public developer program, API documentation, or
  machine-readable API specifications at this time.
